[package]
name = "governance"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
share = { path = "../share" }
access_control = { path = "../access_control" }

[[test]]
name = "lib"
path = "tests/lib.rs"

[[test]]
name = "access_control_tests"
path = "tests/access_control_tests.rs"

[[test]]
name = "governance_flow_tests"
path = "tests/governance_flow_tests.rs"
