[workspace]
members = [
    "contracts/access_control",
    "contracts/invoice",
    "contracts/pool",
    "contracts/credit_score",
    "contracts/share",
    "contracts/governance",
    "contracts/oracle_registry",
    "contracts/compliance",
    "contracts/referral",
    "contracts/auction",
    "contracts/tests",
    "benchmarks",
    "contracts/tranche",
    "contracts/secondary_market",
    "contracts/arbitration",
    "contracts/insurance",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
criterion = "0.5"
soroban-sdk = { version = "22.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
